[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "storage-track"
version = "0.1.0"
description = "REST API and inventory service for tracking physical inventory"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "Flask>=3.1,<4",
]

[project.scripts]
storage-track-api = "app.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
