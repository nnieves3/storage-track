[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "storage-track"
version = "0.1.0"
description = "REST API and inventory service for tracking physical inventory"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.1,<4",
    "grpcio>=1.81.2,<2",
    "protobuf>=6.33.5,<7",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["grpcio-tools==1.81.2"]

[project.scripts]
storage-track-api = "app.__main__:main"
storage-track-service = "service.grpc_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
service = ["inventory.proto", "*.pyi"]
app = ["static/index.html", "static/assets/*"]
